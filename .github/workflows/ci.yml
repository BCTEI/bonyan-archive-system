name: CI - Build & Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev

      - name: Install dependencies
        run: bun install

      - name: Verify seed data (177 folders)
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('src/assets/data/folders.json', 'utf8'));
            if (data.length !== 177) throw new Error('Expected 177 folders, got ' + data.length);
            console.log('✓ Folders seed data contains', data.length, 'folders');
          "

      - name: Build production bundle
        run: bun run build:prod

      - name: Build portable Windows executable
        run: bun run dist:portable

      - name: Build Debian package (.deb)
        run: bun run dist:linux-deb

      - name: Build Linux AppImage
        run: bunx electron-builder --linux AppImage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bonyan-archive-build-${{ github.run_number }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14
