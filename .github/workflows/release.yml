name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev

      - name: Install dependencies
        run: bun install

      - name: Build production bundle
        run: bun run build:prod

      - name: Build portable Windows executable
        run: bun run dist:portable

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          EXE_FILE=$(ls release/*.exe | head -n 1)

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading/overwriting assets..."
            gh release upload "$TAG" "$EXE_FILE" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$EXE_FILE" \
              --title "Bonyan Archive System $TAG" \
              --notes "Release $TAG of Bonyan Center Electronic Archive System" \
              --target "${{ github.sha }}"
          fi
