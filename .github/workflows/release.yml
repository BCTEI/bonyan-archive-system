name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libkrb5-dev libsecret-1-dev

      - name: Install dependencies
        run: bun install

      - name: Build production bundle
        run: bun run build:prod

      - name: Build portable Windows executable
        run: bun run dist:portable

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/*.exe \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }} of Bonyan Center Electronic Archive System" \
            --target "${{ github.sha }}"
