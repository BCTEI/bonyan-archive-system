<div class="login-bg min-h-screen flex items-center justify-center p-4">
  <div class="login-card w-full max-w-[380px] p-8 text-center">
    <div class="w-20 h-20 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-4">
      <mat-icon class="text-white text-4xl !w-10 !h-10">archive</mat-icon>
    </div>
    <h1 class="text-white text-xl font-bold mb-1">نظام الأرشيف الإلكتروني</h1>
    <p class="text-white/70 mb-6">مركز البنيان</p>

    @if (errorMessage) {
      <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-400/40 text-white text-sm text-right">
        {{ errorMessage }}
      </div>
    }

    <div class="space-y-4 text-right">
      <div>
        <label class="block text-white/80 text-sm mb-1">اسم المستخدم</label>
        <input [(ngModel)]="username" (keyup.enter)="login()" autocomplete="username"
               class="w-full px-4 py-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-white/50">
      </div>
      <div>
        <label class="block text-white/80 text-sm mb-1">كلمة المرور</label>
        <div class="relative">
          <input [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" (keyup.enter)="login()" autocomplete="current-password"
                 class="w-full px-4 py-2.5 rounded-lg bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:border-white/50">
          <button type="button" (click)="hidePassword = !hidePassword" class="absolute left-3 top-1/2 -translate-y-1/2 text-white/60 hover:text-white">
            <mat-icon class="!text-lg">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between mt-4 mb-6">
      <label class="flex items-center gap-2 text-white/80 text-sm cursor-pointer">
        <input type="checkbox" [(ngModel)]="rememberMe" class="accent-primary-light w-4 h-4">
        <span>تذكرني</span>
      </label>
      <button type="button" (click)="showForgotPassword()" class="text-white/80 text-sm hover:text-white underline">
        🔑 نسيت كلمة المرور؟
      </button>
    </div>

    <button (click)="login()" [disabled]="loading"
            class="w-full py-2.5 rounded-lg bg-white text-primary font-bold hover:bg-white/90 transition disabled:opacity-60">
      @if (loading) { جاري الدخول... } @else { تسجيل الدخول }
    </button>
  </div>
</div>
