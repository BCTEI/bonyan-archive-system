<div
  dir="rtl"
  class="shell"
  [class.sidebar-open]="sidebarOpen()"
  [class.sidebar-collapsed]="!sidebarOpen()"
  [class.is-mobile]="isMobile()">

  <app-header (toggleSidebar)="toggleSidebar()"></app-header>

  <div class="content-grid">
    <aside class="sidebar" aria-label="القائمة الجانبية">
      <div class="sidebar-inner">
        <nav class="sidebar-nav">
          <a routerLink="/main/dashboard" routerLinkActive="active" class="nav-link">
            <mat-icon>dashboard</mat-icon>
            <span>لوحة التحكم</span>
          </a>
          <a routerLink="/main/documents" routerLinkActive="active" class="nav-link">
            <mat-icon>description</mat-icon>
            <span>الوثائق</span>
          </a>
          <a *appHasPermission="'canViewAudit'" routerLink="/main/audit" routerLinkActive="active" class="nav-link">
            <mat-icon>fact_check</mat-icon>
            <span>سجل التدقيق</span>
          </a>
          <a *appHasPermission="'canManageUsers'" routerLink="/main/users" routerLinkActive="active" class="nav-link">
            <mat-icon>manage_accounts</mat-icon>
            <span>إدارة المستخدمين</span>
          </a>
        </nav>

        <div class="border-t border-border my-2"></div>

        <app-folder-tree></app-folder-tree>
      </div>
    </aside>

    <main class="main-content">
      <nav class="breadcrumb" aria-label="مسار التنقل">
        @for (crumb of breadcrumb(); track crumb.label; let last = $last) {
          @if (!last && crumb.link) {
            <a [routerLink]="crumb.link" class="crumb-link">{{ crumb.label }}</a>
            <span class="crumb-separator">/</span>
          } @else {
            <span class="crumb-current">{{ crumb.label }}</span>
          }
        }
      </nav>
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Backdrop for mobile sidebar -->
  @if (isMobile() && sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="toggleSidebar()" aria-hidden="true"></div>
  }
</div>

<app-toast></app-toast>
