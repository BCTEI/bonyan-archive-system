<div class="p-4 max-w-xl mx-auto" dir="rtl">
  <h1 class="text-2xl font-bold text-primary flex items-center gap-2 mb-6">
    <mat-icon>lock_reset</mat-icon>
    تغيير كلمة المرور
  </h1>

  <mat-card>
    <mat-card-content class="p-6 space-y-4">
      <mat-form-field class="w-full" appearance="outline">
        <mat-label>كلمة المرور الحالية</mat-label>
        <input matInput [type]="hideCurrent() ? 'password' : 'text'" [(ngModel)]="currentPassword" autocomplete="current-password">
        <button mat-icon-button matSuffix (click)="hideCurrent.set(!hideCurrent())" type="button">
          <mat-icon>{{ hideCurrent() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label>كلمة المرور الجديدة</mat-label>
        <input matInput [type]="hideNew() ? 'password' : 'text'" [(ngModel)]="newPassword" autocomplete="new-password">
        <button mat-icon-button matSuffix (click)="hideNew.set(!hideNew())" type="button">
          <mat-icon>{{ hideNew() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (errors()['newPassword']) {
          <mat-error>{{ errors()['newPassword'] }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="w-full" appearance="outline">
        <mat-label>تأكيد كلمة المرور</mat-label>
        <input matInput [type]="hideConfirm() ? 'password' : 'text'" [(ngModel)]="confirmPassword" autocomplete="new-password">
        <button mat-icon-button matSuffix (click)="hideConfirm.set(!hideConfirm())" type="button">
          <mat-icon>{{ hideConfirm() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        @if (errors()['confirmPassword']) {
          <mat-error>{{ errors()['confirmPassword'] }}</mat-error>
        }
      </mat-form-field>

      <button mat-raised-button color="primary" class="w-full" (click)="submit()" [disabled]="loading()">
        @if (loading()) { جاري الحفظ... } @else { تغيير كلمة المرور }
      </button>
    </mat-card-content>
  </mat-card>
</div>
