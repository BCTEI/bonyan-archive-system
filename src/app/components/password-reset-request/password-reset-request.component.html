<h2 mat-dialog-title class="text-right flex items-center gap-2">
  <mat-icon>lock_reset</mat-icon>
  طلب إعادة تعيين كلمة المرور
</h2>

<mat-dialog-content class="text-right">
  <div class="space-y-4 min-w-[300px]">
    <p class="text-text-light text-sm">أدخل اسم المستخدم لإرسال طلب إعادة تعيين كلمة المرور إلى المشرف.</p>
    <mat-form-field class="w-full" appearance="outline">
      <mat-label>اسم المستخدم</mat-label>
      <input matInput [(ngModel)]="username" autocomplete="username" (keyup.enter)="submit()">
    </mat-form-field>

    @if (message()) {
      <div class="p-3 rounded-lg text-sm"
           [class.bg-green-100]="success()"
           [class.text-green-800]="success()"
           [class.bg-red-100]="!success()"
           [class.text-red-800]="!success()">
        {{ message() }}
      </div>
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()" [disabled]="loading()">إلغاء</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading()">
    @if (loading()) { جاري الإرسال... } @else { إرسال الطلب }
  </button>
</mat-dialog-actions>
