<h2 mat-dialog-title class="text-primary flex items-center gap-2">
  <mat-icon>vpn_key</mat-icon>
  تأكيد الهوية
</h2>
<mat-dialog-content>
  <p class="text-text mb-4">{{ data.message }}</p>
  <mat-form-field appearance="outline" class="w-full">
    <mat-label>كلمة المرور</mat-label>
    <input matInput type="password" [(ngModel)]="password" (keyup.enter)="confirm()" autofocus>
  </mat-form-field>
  @if (error) {
    <mat-error class="text-sm">{{ error }}</mat-error>
  }
</mat-dialog-content>
<mat-dialog-actions align="end" class="gap-2">
  <button mat-button type="button" (click)="cancel()">إلغاء</button>
  <button mat-raised-button color="primary" type="button" (click)="confirm()">تأكيد</button>
</mat-dialog-actions>
