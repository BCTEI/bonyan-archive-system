<div class="space-y-4">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <h1 class="text-2xl font-bold text-primary">الوثائق</h1>
    <div class="flex items-center gap-2">
      <button *appHasPermission="'canCreateDocument'" mat-raised-button color="primary" (click)="openNew()">
        <mat-icon>add</mat-icon>
        وثيقة جديدة
      </button>
      <button *appHasPermission="'canExportImport'" mat-stroked-button color="primary" (click)="exportData()">
        <mat-icon>download</mat-icon>
        تصدير
      </button>
      <button *appHasPermission="'canExportImport'" mat-stroked-button color="primary" (click)="fileInput.click()">
        <mat-icon>upload</mat-icon>
        استيراد
      </button>
      <input type="file" accept=".json,application/json" hidden #fileInput (change)="onImport($event)">
    </div>
  </div>

  <div class="bg-card p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4">
    <div class="relative flex-1">
      <mat-icon class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light">search</mat-icon>
      <input type="text" [ngModel]="search()" (ngModelChange)="setSearch($event)" placeholder="بحث في الوثائق..."
             class="w-full pr-10 pl-3 py-2 rounded-lg border border-border bg-bg text-sm focus:outline-none focus:border-primary">
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <button (click)="setType('الكل')" class="px-3 py-1.5 rounded-full text-sm font-medium transition"
              [class.bg-primary]="selectedType() === 'الكل'" [class.text-white]="selectedType() === 'الكل'"
              [class.bg-secondary]="selectedType() !== 'الكل'" [class.text-text]="selectedType() !== 'الكل'">الكل</button>
      @for (t of types; track t) {
        <button (click)="setType(t)" class="px-3 py-1.5 rounded-full text-sm font-medium transition"
                [class.bg-primary]="selectedType() === t" [class.text-white]="selectedType() === t"
                [class.bg-secondary]="selectedType() !== t" [class.text-text]="selectedType() !== t">{{ t }}</button>
      }
    </div>
    <div class="min-w-[180px]">
      <select [ngModel]="selectedFolder()" (ngModelChange)="setFolder($event === 'الكل' ? 'الكل' : +$event)"
              class="w-full px-3 py-2 rounded-lg border border-border bg-bg text-sm focus:outline-none focus:border-primary">
        <option value="الكل">كل المجلدات</option>
        @for (folder of folders(); track folder.id) {
          <option [value]="folder.id">{{ folder.name }}</option>
        }
      </select>
    </div>
  </div>

  @if (filtered().length === 0) {
    <div class="text-center py-16 text-text-light">
      <mat-icon class="!text-6xl !w-16 !h-16 mb-4 opacity-40">folder_open</mat-icon>
      <p>لا توجد وثائق مطابقة</p>
    </div>
  } @else {
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4">
      @for (doc of filtered(); track doc.id) {
        <app-document-card [doc]="doc" [folderName]="folderName(doc.folder_id)"
                           [highlight]="search()"
                           (view)="onView($event)" (edit)="onEdit($event)" (delete)="onDelete($event)" (print)="onPrint($event)">
        </app-document-card>
      }
    </div>
  }
</div>
