<div class="space-y-4">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <h1 class="text-2xl font-bold text-primary">سجل المراقبة</h1>
    <div class="flex items-center gap-2">
      <button mat-stroked-button color="primary" (click)="exportCsv()">
        <mat-icon>download</mat-icon>
        تصدير CSV
      </button>
      <button *appHasPermission="'canClearData'" mat-stroked-button color="warn" (click)="clearAll()">
        <mat-icon>delete_sweep</mat-icon>
        مسح السجل
      </button>
    </div>
  </div>

  <div class="bg-card p-4 rounded-xl shadow-sm">
    <div class="relative mb-4">
      <mat-icon class="absolute right-3 top-1/2 -translate-y-1/2 text-text-light">search</mat-icon>
      <input type="text" [ngModel]="filter()" (ngModelChange)="filter.set($event)" placeholder="تصفية السجل..."
             class="w-full pr-10 pl-3 py-2 rounded-lg border border-border bg-bg text-sm focus:outline-none focus:border-primary">
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="filteredEntries()" class="w-full">
        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef> الوقت </th>
          <td mat-cell *matCellDef="let entry"> {{ entry.timestamp }} </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> الإجراء </th>
          <td mat-cell *matCellDef="let entry">
            <span class="px-2 py-0.5 rounded text-xs font-bold" [class]="actionClass(entry.action)">{{ entry.action }}</span>
          </td>
        </ng-container>
        <ng-container matColumnDef="doc_ref">
          <th mat-header-cell *matHeaderCellDef> الوثيقة </th>
          <td mat-cell *matCellDef="let entry"> {{ entry.doc_ref ?? '-' }} </td>
        </ng-container>
        <ng-container matColumnDef="details">
          <th mat-header-cell *matHeaderCellDef> التفاصيل </th>
          <td mat-cell *matCellDef="let entry"> {{ entry.details ?? '-' }} </td>
        </ng-container>
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef> المستخدم </th>
          <td mat-cell *matCellDef="let entry"> {{ entry.username ?? '-' }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
