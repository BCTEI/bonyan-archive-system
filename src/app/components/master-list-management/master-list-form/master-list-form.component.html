<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
  <mat-form-field class="w-full" appearance="outline">
    <mat-label>اسم {{ typeLabel() }}</mat-label>
    <input matInput [ngModel]="name()" (ngModelChange)="name.set($event)" (keyup.enter)="save()" [disabled]="isSaving()" placeholder="أدخل الاسم...">
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="isSaving()">إلغاء</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="isSaving()">
    @if (isSaving()) {
      جاري الحفظ...
    } @else {
      حفظ
    }
  </button>
</mat-dialog-actions>
